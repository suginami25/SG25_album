<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>SG25 Photo Archive Platform（2025年 杉並高校25期 同期会アルバム）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="杉並高校25期 2025年同期会の写真を三画面方式で閲覧できるアルバムビューアです。" />

  <link rel="stylesheet" href="style.css" />

  <!-- 写真インデックス（カテゴリ／グループ／写真一覧） -->
  <script src="photos_index.js"></script>
  <!-- 三画面ビューア本体 -->
  <script src="viewer.js"></script>
  <!-- 画像の長押し・右クリック抑制用 -->
  <script src="touch_protection.js"></script>
</head>
<body>
  <div class="app-root">

    <!-- ヘッダー：校章ロゴ＋タイトル -->
    <header class="app-header">
      <div class="app-header-inner">
        <img
          src="assets/logo_suginami.jpg"
          alt="杉並高校 校章ロゴ"
          class="app-logo"
        />
        <div class="app-title-text">
          2025年 杉並高校25期 同期会アルバム
        </div>
      </div>
    </header>

    <!-- メイン：3画面構成（カテゴリ / サムネイル / 拡大表示） -->
    <main class="app-main">

      <!-- 第1画面：カテゴリ一覧 -->
      <section id="screen-category">
        <div class="category-screen-inner">
          <h1 class="category-screen-title">
            カテゴリを選択してください
          </h1>
          <div id="category-list" class="category-list">
            <!-- viewer.js によりカテゴリボタン（.category-card）が生成されます -->
          </div>
        </div>
      </section>

      <!-- 第2画面：カテゴリ配下のサムネイル一覧 -->
      <section id="screen-gallery" style="display: none;">
        <div class="gallery-screen-inner">
          <h2 id="gallery-title" class="gallery-title"></h2>
          <div id="gallery-container" class="gallery-container">
            <!-- viewer.js によりグループ単位の .gallery-grid / .thumb が生成されます -->
          </div>
        </div>
      </section>

      <!-- 第3画面：1枚拡大表示（黒背景＋キャプション） -->
      <section id="screen-viewer" style="display: none;">
        <div class="viewer-body">
          <div class="viewer-image-wrapper">
            <img
              id="viewer-image"
              class="viewer-image"
              src=""
              alt=""
            />
          </div>
          <div class="viewer-meta">
            <div id="viewer-filename" class="viewer-filename"></div>
            <div id="viewer-context" class="viewer-context"></div>
          </div>
        </div>
      </section>

    </main>

    <!-- 常時表示ボタン：左下 🏠（第1画面へ） -->
    <button
      id="home-button"
      class="home-button"
      type="button"
      aria-label="カテゴリ一覧へ戻る"
    >
      🏠
    </button>

    <!-- 右下 🔙（第3画面から第2画面へ戻る） -->
    <button
      id="viewer-close-button"
      class="back-button"
      type="button"
      aria-label="ひとつ前の画面に戻る"
    >
      🔙
    </button>

  </div>
</body>
</html>
